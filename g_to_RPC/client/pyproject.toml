[project]
name = "productclient"
version = "0.1.0"
description = "Typed Python client for ecommerce.v1.ProductCatalogService"
requires-python = ">=3.11"
# grpcio, grpcio-status and grpcio-tools move in lockstep: generated
# *_pb2_grpc.py refuses to import under an older grpcio than generated it.
dependencies = [
    "grpcio>=1.84.0,<1.85",
    "grpcio-status>=1.84.0,<1.85",
    "protobuf>=7.36.2,<8",
    "googleapis-common-protos>=1.75.5,<2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0,<1.85",
    "mypy-protobuf>=5.1.0,<6",
    # mypy runs inside this environment (not via uvx) so it sees the grpc
    # and protobuf stubs below; pinned to the repo-wide version.
    "mypy==2.4.0",
    "types-grpcio-status>=1.0.0.20260408",
    "types-grpcio>=1.84.0.20260928",
    "types-protobuf>=7.35.1.20260906",
]

# Canonical lint, format and type-check config for every Python prototype in
# Psychic-compendium. Copy it verbatim into the prototype directory. Changes
# belong in templates/pyproject.toml first, then get propagated everywhere.

[tool.ruff]
line-length = 80 # Google Python Style Guide
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PL",  # pylint
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle, Google convention below
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; magic values are the point.
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true

# --- Prototype-specific settings (below the canonical block) ---------------
# TOML cannot reopen a table defined above, so these use new subtables.

# ecommerce/ is generated by `make generate` from ../proto: not ours to lint,
# format or type-check. Its .pyi stubs (from mypy-protobuf) are still what
# mypy uses to check calls into it.
[tool.ruff.format]
exclude = ["ecommerce/**"]

[tool.ruff.lint.extend-per-file-ignores]
"ecommerce/**" = ["ALL"]

[tool.ruff.lint.isort]
# procs is a test helper module in tests/, imported top-level.
known-first-party = ["ecommerce", "procs", "productclient"]

[[tool.mypy.overrides]]
module = ["ecommerce.*"]
ignore_errors = true

# googleapis-common-protos ships .pyi stubs but no py.typed marker; use them.
[[tool.mypy.overrides]]
module = ["google.rpc.*"]
follow_untyped_imports = true
