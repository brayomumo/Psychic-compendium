# Go code generation. The plugin versions the committed code was generated
# with are pinned in the Makefile (PROTOC_GEN_GO_VERSION,
# PROTOC_GEN_GO_GRPC_VERSION) and appear in each generated file's header.
# Python code is generated by grpcio-tools from the client's locked
# environment; see `make generate`.
version: v2
plugins:
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: server/gen
    opt: paths=source_relative
